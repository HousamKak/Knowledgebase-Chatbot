# Atlassian Forge manifest
modules:
  macro:
    - key: knowledgebase-ai-assistant  # Fixed key format
      resource: main
      resolver:
        function: resolver
      title: knowledgebase-ai-assistant
      description: An AI assistant that answers questions using multiple LLMs and knowledge sources

  function:
    - key: resolver
      handler: index.handler

resources:
  - key: main
    path: client/build
    tunnel:
      port: 3000

permissions:
  scopes:
    - storage:app
    - read:confluence-content.summary
    - read:confluence-space.summary
    - read:page:confluence
  content:
    styles:
      - unsafe-inline
  external:
    fetch:
      backend:
        - https://api.openai.com
        - https://api.anthropic.com
        - https://api.halo-istm.example.com

app:
  id: ari:cloud:ecosystem::app/358ee064-140d-458b-8e55-5009b7bceaf8
  runtime:
    name: nodejs22.x
